name: Multi-Arch Docker Build

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile      

  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-architectures:
    strategy:
      matrix:
        include:
          - platform: "linux/amd64"
            machine: ubuntu-latest
            arch_suffix: amd64
          - platform: "linux/arm64"
            machine: ubuntu-24.04-arm
            arch_suffix: arm64

    name: Build dfw (${{ matrix.arch_suffix }})
    runs-on: ${{ matrix.machine }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name (GHCR)
        id: lowercase
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/dfw" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Set Docker Hub image (optional)
        id: dockerhub
        run: |
          # DOCKERHUB_REPOSITORY should be set as a secret (e.g. "myuser/docker-flutter-web")
          if [ -n "${{ secrets.DOCKERHUB_REPOSITORY }}" ]; then
            v="${{ secrets.DOCKERHUB_REPOSITORY }}"
            # lowercase and output
            echo "docker_image=$(echo $v | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          else
            echo "docker_image=" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub (if configured)
        if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN && steps.dockerhub.outputs.docker_image != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags for this build
        id: tags
        run: |
          GH_IMAGE=${{ steps.lowercase.outputs.image }}:${{ matrix.arch_suffix }}
          if [ -n "${{ steps.dockerhub.outputs.docker_image }}" ]; then
            DOCKER_IMAGE="${{ steps.dockerhub.outputs.docker_image }}:${{ matrix.arch_suffix }}"
            DELIM=$(openssl rand -hex 8)
            printf "tags<<%s\n%s\n%s\n%s\n" "$DELIM" "$GH_IMAGE" "$DOCKER_IMAGE" "$DELIM" >> $GITHUB_OUTPUT
          else
            printf "tags=%s\n" "$GH_IMAGE" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: ${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch_suffix }}
          cache-from: type=gha,scope=${{ matrix.arch_suffix }}

  create-multiarch-manifest:
    needs: build-architectures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name (GHCR)
        id: lowercase
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/dfw" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Set Docker Hub image (optional)
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_REPOSITORY }}" ]; then
            v="${{ secrets.DOCKERHUB_REPOSITORY }}"
            echo "docker_image=$(echo $v | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          else
            echo "docker_image=" >> $GITHUB_OUTPUT
          fi

      - name: Create and push multi-arch manifest to GHCR
        run: |
          SOURCE_IMAGES=(
            "${{ steps.lowercase.outputs.image }}:amd64"
            "${{ steps.lowercase.outputs.image }}:arm64"
          )
          
          echo "Creating manifest for latest tag on GHCR"
          docker buildx imagetools create -t "${{ steps.lowercase.outputs.image }}:latest" "${SOURCE_IMAGES[@]}"

      - name: Inspect multi-arch image (GHCR)
        run: |
          docker buildx imagetools inspect ${{ steps.lowercase.outputs.image }}:latest

      - name: Log in to Docker Hub for manifest push (if configured)
        if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN && steps.dockerhub.outputs.docker_image != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest to Docker Hub (optional)
        if: ${{ steps.dockerhub.outputs.docker_image != '' }}
        run: |
          SOURCE_IMAGES=(
            "${{ steps.dockerhub.outputs.docker_image }}:amd64"
            "${{ steps.dockerhub.outputs.docker_image }}:arm64"
          )
          echo "Creating manifest for Docker Hub latest tag"
          docker buildx imagetools create -t "${{ steps.dockerhub.outputs.docker_image }}:latest" "${SOURCE_IMAGES[@]}"

      - name: Inspect multi-arch image (Docker Hub) (optional)
        if: ${{ steps.dockerhub.outputs.docker_image != '' }}
        run: |
          docker buildx imagetools inspect ${{ steps.dockerhub.outputs.docker_image }}:latest
